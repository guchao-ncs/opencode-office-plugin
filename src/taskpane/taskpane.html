<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI Assistant</title>

    <!-- Office JavaScript API -->
    <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>

    <!-- For more information on Fluent UI, visit https://developer.microsoft.com/fluentui#/. -->
    <link rel="stylesheet" href="https://res-1.cdn.office.net/files/fabric-cdn-prod_20230815.002/office-ui-fabric-core/11.1.0/css/fabric.min.css"/>

    <!-- Template styles -->
    <link href="taskpane.css" rel="stylesheet" type="text/css" />
</head>

<body class="ms-font-m ms-welcome ms-Fabric">
    <section id="sideload-msg" class="ms-welcome__main">
        <h2 class="ms-font-xl">Please <a target="_blank" href="https://learn.microsoft.com/office/dev/add-ins/testing/test-debug-office-add-ins#sideload-an-office-add-in-for-testing">sideload</a> your add-in to see app body.</h2>
    </section>
    <main id="app-body" class="chat-app" style="display: none;">
        <header class="chat-header">
            <img width="24" height="24" src="../../assets/icon-32.png" alt="AI Assistant" />
            <h1 class="ms-font-l">AI Assistant</h1>
            <button type="button" id="settings-toggle" class="chat-settings-toggle" aria-label="Settings" title="Settings">⚙</button>
        </header>
        <section id="settings-panel" class="settings-panel" style="display: none;">
            <div class="settings-tab-row">
                <button type="button" id="tab-btn-settings" class="settings-tab settings-tab--active">Settings</button>
                <button type="button" id="tab-btn-library" class="settings-tab">Prompt library</button>
            </div>
            <div id="tab-settings" class="settings-tab-content">
                <label for="system-instruction-input">System Instruction</label>
                <textarea id="system-instruction-input" class="settings-textarea" rows="4"
                    placeholder="Standing rules the assistant must follow in every conversation, e.g. &quot;Always reply in formal English. Focus on tender/proposal quality.&quot;"></textarea>
                <label for="persona-input">Persona</label>
                <textarea id="persona-input" class="settings-textarea" rows="4"
                    placeholder="Who the assistant should be, e.g. &quot;You are a senior bid manager at NCS with 15 years of government-tender experience.&quot;"></textarea>
                <div class="settings-panel-actions">
                    <button type="button" id="settings-save" class="ms-Button ms-Button--primary">
                        <span class="ms-Button-label">Save</span>
                    </button>
                    <button type="button" id="settings-clear" class="ms-Button">
                        <span class="ms-Button-label">Clear</span>
                    </button>
                </div>
                <p id="settings-status" class="settings-status"></p>
            </div>
            <div id="tab-library" class="settings-tab-content" style="display: none;">
                <p class="settings-hint">Templates the 💡 "Prompt ideas" button picks from (the assistant derives
                    document-specific suggestions from the most relevant ones). Edit freely — placeholders like
                    [Topic] are filled in automatically.</p>
                <div id="prompt-library-list" class="prompt-library-list"></div>
                <div class="settings-panel-actions">
                    <button type="button" id="library-add" class="ms-Button">
                        <span class="ms-Button-label">+ Add</span>
                    </button>
                    <button type="button" id="library-save" class="ms-Button ms-Button--primary">
                        <span class="ms-Button-label">Save library</span>
                    </button>
                    <button type="button" id="library-reset" class="ms-Button">
                        <span class="ms-Button-label">Reset to defaults</span>
                    </button>
                </div>
                <p id="library-status" class="settings-status"></p>
            </div>
        </section>
        <div id="chat-log" class="chat-log" aria-live="polite"></div>
        <div id="prompt-ideas-toolbar" class="prompt-ideas-toolbar" style="display: none;">
            <button type="button" id="prompt-ideas-toggle" class="prompt-ideas-toggle">
                <span aria-hidden="true">💡</span> Prompt ideas
            </button>
        </div>
        <section id="doc-suggestions-panel" class="doc-suggestions-panel" style="display: none;">
            <p class="doc-suggestions-label">✨ Explore what's inside your document</p>
            <div id="doc-suggestions" class="chat-suggestions doc-suggestions"></div>
        </section>
        <form id="chat-form" class="chat-input-row">
            <textarea id="chat-input" class="chat-input" rows="2" placeholder="Ask OpenCode to edit this document..."></textarea>
            <button type="submit" id="chat-send" class="chat-send" aria-label="Send" title="Send" disabled>
                <svg class="chat-send-icon chat-send-icon--send" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
                    <path d="M8 2.5l5.2 5.2-1.4 1.4L9 6.3v7.2H7V6.3L4.2 9.1 2.8 7.7z" fill="currentColor"/>
                </svg>
                <svg class="chat-send-icon chat-send-icon--stop" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
                    <rect x="4" y="4" width="8" height="8" rx="1.5" fill="currentColor"/>
                </svg>
            </button>
        </form>
    </main>
</body>

</html>
